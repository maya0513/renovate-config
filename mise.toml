[tools]
node = "24.21.0"
pnpm = "12.14.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.bootstrap]
description = "Install locked Node dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Validate the preset, TypeScript, workflows, and regression cases"
depends = ["validate", "typecheck", "test", "lint"]

[tasks.validate]
description = "Validate Renovate configuration in strict repository mode"
depends = ["bootstrap"]
run = "pnpm exec renovate-config-validator --strict --no-global default.json presets/*.json renovate.json"

[tasks.typecheck]
description = "Check TypeScript without emitting JavaScript"
depends = ["bootstrap"]
run = "pnpm exec tsc --noEmit"

[tasks."test:tools"]
description = "Install the fixed executable pairs used by transition regression tests"
run = "mise -C tests/fixtures install node pnpm"

[tasks.test]
description = "Run preset and reusable workflow regression tests"
depends = ["bootstrap", "test:tools"]
run = "node --test --test-isolation=none tests/*.test.ts"

[tasks.lint]
description = "Check GitHub Actions syntax and security"
run = [
  "actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml",
  "zizmor --offline .github/workflows .github/actions",
  "shellcheck -x -P .github/actions/lib .github/actions/*/*.sh",
]

[tasks.dry-run]
description = "Inspect dependency extraction and updates using the local preset"
depends = ["bootstrap"]
run = "node scripts/dry-run.ts"
