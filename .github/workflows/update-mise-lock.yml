name: Update mise lockfiles

on:
  push:
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  mise-lock:
    uses: $/.github/workflows/mise-lock.yml
    with:
      app-client-id: ${{ vars.MISE_LOCK_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
