name: Publish validated pnpm artifacts
on:
  workflow_call:
    inputs:
      base:
        description: Original consumer commit SHA
        required: false
        type: string
        default: ""
      changed:
        description: Whether preparation generated a validated payload
        required: false
        type: string
        default: "false"
      artifact-id:
        description: Immutable artifact ID from pnpm-outputs
        required: false
        type: string
        default: ""
      mise:
        description: Allow mise lockfiles and sidecars in the payload
        required: false
        type: boolean
        default: true
      viteplus:
        description: Allow root Vite+ declarations and pnpm lockfile in the payload
        required: false
        type: boolean
        default: false
      post-update-paths:
        description: Allowed additional output files or directories (newline-separated)
        required: false
        type: string
        default: ""
      app-client-id:
        description: GitHub App client ID
        required: false
        type: string
        default: ""
    secrets:
      app-private-key:
        description: GitHub App private key for publication
        required: false
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'push' && github.event.sender.id == 29139614 && startsWith(github.ref, 'refs/heads/renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_MISE: ${{ inputs.mise }}
      HAS_VITEPLUS: ${{ inputs.viteplus }}
      POST_UPDATE_PATHS: ${{ inputs['post-update-paths'] }}
    steps:
      - name: Require App credentials for updates
        id: credentials
        env:
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Update mode requires app-client-id and app-private-key"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
        if: inputs.changed == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/pnpm-artifacts
        if: inputs.changed == 'true'
      - name: Validate the payload and commit only allowed artifacts
        id: commit
        if: inputs.changed == 'true'
        env:
          BASE_SHA: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          payload="$RUNNER_TEMP/pnpm-artifacts/changes.patch"
          [[ -f "$payload" && ! -L "$payload" ]]
          manifest="$RUNNER_TEMP/pnpm-artifacts/manifest.json"
          [[ -f "$manifest" && ! -L "$manifest" ]] || { echo '::error::A regular publishing manifest is required'; exit 1; }
          jq -e --arg base "$BASE_SHA" --arg mise "$HAS_MISE" --arg viteplus "$HAS_VITEPLUS" --arg paths "$POST_UPDATE_PATHS" '
            def output_paths:
              split("\n") | map(rtrimstr("\r") | select(length > 0) | sub("^(\\./)+"; "") | sub("/+$"; "")) |
              if all(.[]; length > 0 and startswith("/") == false and
                  (split("/") | all(.[]; . != "..")) and . != "." and . != ".git" and startswith(".git/") == false)
              then unique else error("Invalid publishing output paths") end;
            ([if $mise == "true" then "mise-pnpm" else empty end, if $viteplus == "true" then "pnpm-viteplus" else empty end]) as $components |
            ($paths | output_paths) as $allowed |
            (keys == ["base", "components", "postUpdatePaths"]) and .base == $base and
            (.components | type == "array" and length > 0 and length == (unique | length) and
              all(.[]; type == "string" and (. as $component | $components | index($component) != null))) and
            (.postUpdatePaths | type == "array" and all(.[]; type == "string" and test("[\\u0000\\r\\n]") == false) and
              . == (join("\n") | output_paths) and
              all(.[]; . as $requested | any($allowed[]; . as $permit |
                $requested == $permit or ($requested | startswith($permit + "/")))))
          ' "$manifest" > /dev/null || { echo '::error::Publishing manifest exceeds explicit permissions or has invalid metadata'; exit 1; }
          allowed="$RUNNER_TEMP/publish-allowed"
          : > "$allowed"
          if [[ "$HAS_MISE" == true ]]; then
            git ls-files -z -- 'mise.lock' 'mise.*.lock' '**/mise.lock' '**/mise.*.lock' > "$RUNNER_TEMP/publish-locks"
            while IFS= read -r -d '' lock; do
              printf '%s\0' "$lock" >> "$allowed"
              directory=$(dirname "$lock")
              case "$directory" in
                .mise|*/.mise|.config/mise|*/.config/mise) sidecars="$directory/locks" ;;
                .config|*/.config) sidecars="$directory/mise/locks" ;;
                *) sidecars="$directory/.mise/locks" ;;
              esac
              if [[ "${lock##*/}" != mise.lock ]]; then sidecars+="/${lock##*/}"; sidecars=${sidecars%.lock}; fi
              printf '%s/\0' "${sidecars#./}" >> "$allowed"
            done < "$RUNNER_TEMP/publish-locks"
          fi
          if [[ "$HAS_VITEPLUS" == true ]]; then
            printf 'pnpm-lock.yaml\0' >> "$allowed"
            printf 'package.json\0pnpm-workspace.yaml\0' >> "$allowed"
          fi
          while IFS= read -r path || [[ -n "$path" ]]; do
            path=${path%$'\r'}
            [[ -n "$path" ]] || continue
            while [[ "$path" == ./* ]]; do path=${path#./}; done
            case "$path" in ''|/*|.|..|../*|*/../*|*/..|.git|.git/*) exit 1 ;; esac
            printf '%s\0%s/\0' "$path" "${path%/}" >> "$allowed"
          done <<< "$POST_UPDATE_PATHS"
          git -c core.hooksPath=/dev/null apply --index --binary -- "$payload"
          git diff --cached --no-renames --name-only -z > "$RUNNER_TEMP/publish-changes"
          while IFS= read -r -d '' path; do
            accepted=false
            while IFS= read -r -d '' permit; do
              if [[ "$permit" == */ ]]; then
                if [[ "$path" == "$permit"* ]]; then accepted=true; fi
              elif [[ "$path" == "$permit" ]]; then accepted=true
              fi
            done < "$allowed"
            if [[ "$accepted" != true || "$path" == .git/* || "$path" == /* ]]; then
              echo "::error::Prepared payload changes a disallowed path: $path"
              exit 1
            fi
          done < "$RUNNER_TEMP/publish-changes"
          # Dependency artifacts must be ordinary files, never symlinks or submodules.
          if git diff --cached --raw | grep -Eq '^:[0-9]{6} (120000|160000) '; then
            echo '::error::Prepared artifacts must be regular files'
            exit 1
          fi
          git diff --cached --check
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): regenerate dependency artifacts'
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
        if: inputs.changed == 'true'
      - name: Push only if the Renovate branch has not moved
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ inputs.base }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$BRANCH" == renovate/* ]]
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="refs/heads/${BRANCH}:${BASE_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"
        if: inputs.changed == 'true'
