name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-artifacts:
    name: dependency-artifacts / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_SAFE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: false
      - id: mise
        uses: $/.github/actions/mise-pnpm
      - id: outputs
        uses: $/.github/actions/pnpm-outputs
        with:
          mise-state: ${{ steps.mise.outputs.state }}
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Validate configuration, workflows, and regression cases
        run: mise run check
