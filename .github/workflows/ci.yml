name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-artifacts:
    name: dependency-artifacts / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_SAFE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.25 # Validated with this repository's locked installation.
          install: false
          cache: false
      - id: mise
        uses: $/.github/actions/mise-pnpm
      - id: outputs
        uses: $/.github/actions/pnpm-outputs
        with:
          mise-state: ${{ steps.mise.outputs.state }}
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.25
          cache: false
      - name: Validate configuration, workflows, and regression cases
        run: mise run check
