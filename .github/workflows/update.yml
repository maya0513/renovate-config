name: Update dependency artifacts

on:
  push:
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  update:
    uses: $/.github/workflows/dependency-artifacts.yml
    with:
      app-client-id: ${{ vars.MISE_LOCK_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
