name: dependency-artifacts
on:
  workflow_call:
    inputs:
      verify-only:
        description: Validate dependency artifacts without committing or pushing; locked groups do not re-resolve
        required: false
        type: boolean
        default: false
      app-client-id:
        description: GitHub App client ID, required only when verify-only is false
        required: false
        type: string
        default: ""
      post-update-task:
        description: Optional mise task that regenerates dependency-derived files
        required: false
        type: string
        default: ""
      post-update-paths:
        description: Newline-separated repository-relative files or directories to commit after the task
        required: false
        type: string
        default: ""
      lock-groups:
        description: "JSON groups: lockfile, tools, platforms, verify (regenerate or locked); empty preserves all-tool regeneration"
        required: false
        type: string
        default: "[]"
      mise-enabled:
        description: Regenerate tracked mise lockfiles; disable for standalone Vite+ synchronization
        required: false
        type: boolean
        default: true
      sync-vite-plus:
        description: Synchronize Vite+ artifacts in the same preparation and commit as mise
        required: false
        type: boolean
        default: false
      sync-declarations:
        description: Synchronize exact coverage and workspace overrides with bundled Vite+ dependencies
        required: false
        type: boolean
        default: false
      node-version:
        description: Standalone Vite+ Node major or exact stable version; mise-enabled uses the caller lockfile instead
        required: false
        type: string
        default: "24"
      pnpm-version:
        description: Standalone Vite+ pnpm major or exact stable version; mise-enabled uses the caller lockfile instead
        required: false
        type: string
        default: "12"
    secrets:
      app-private-key:
        description: GitHub App private key, required only when verify-only is false
        required: false
permissions:
  contents: read
jobs:
  prepare:
    if: inputs['verify-only'] || (github.event_name == 'push' && github.event.sender.id == 29139614 && startsWith(github.ref, 'refs/heads/renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dependency-artifacts-${{ inputs['verify-only'] }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      MISE_SAFE: "1"
      VERIFY_ONLY: ${{ inputs['verify-only'] }}
      MISE_ENABLED: ${{ inputs['mise-enabled'] }}
      SYNC_VITE_PLUS: ${{ inputs['sync-vite-plus'] }}
      SYNC_DECLARATIONS: ${{ inputs['sync-declarations'] }}
      POST_UPDATE_TASK: ${{ inputs.post-update-task }}
      POST_UPDATE_PATHS: ${{ inputs.post-update-paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - name: Regenerate or validate selected mise tools
        id: locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCK_GROUPS: ${{ inputs['lock-groups'] }}
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          lockfiles="$RUNNER_TEMP/mise-lockfiles"
          artifacts="$RUNNER_TEMP/mise-lock-artifacts"
          : > "$lockfiles"
          if [[ "$MISE_ENABLED" == true ]]; then
            git ls-files -z -- 'mise.lock' 'mise.*.lock' '**/mise.lock' '**/mise.*.lock' > "$lockfiles"
          fi
          cp "$lockfiles" "$artifacts"
          root=$(git rev-parse --show-toplevel)
          while IFS= read -r -d '' lock; do
            if [[ ! -f "$lock" || -L "$lock" || "$(realpath "$lock")" != "$root/"* ]]; then
              echo "::error::Tracked lockfiles must be regular files inside the repository: $lock"
              exit 1
            fi
          done < "$lockfiles"

          mise_for_lock() {
            local lock="$1" name="${1##*/}" mise_env="" is_local=false
            shift
            local args=("$@")
            case "$name" in
              mise.lock) ;;
              mise.local.lock) is_local=true ;;
              mise.*.local.lock) mise_env=${name#mise.}; mise_env=${mise_env%.local.lock}; is_local=true ;;
              mise.*.lock) mise_env=${name#mise.}; mise_env=${mise_env%.lock} ;;
            esac
            if [[ "$1" == lock && "$is_local" == true ]]; then args+=(--local); fi
            (cd "$(dirname "$lock")" && MISE_ENV="$mise_env" mise "${args[@]}")
          }

          collect_sidecars() {
            local lock="$1" path
            mise_for_lock "$lock" lock --sidecars --json > "$RUNNER_TEMP/mise-sidecars.json"
            jq -j --arg lock "${lock##*/}" '.[] | select(.lockfile == $lock) | .sidecars[] | .path + "\u0000"' \
              "$RUNNER_TEMP/mise-sidecars.json" > "$RUNNER_TEMP/mise-sidecars"
            while IFS= read -r -d '' path; do
              if [[ "$path" != /* ]]; then path="$(dirname "$lock")/$path"; fi
              printf '%s\0' "$path" >> "$artifacts"
            done < "$RUNNER_TEMP/mise-sidecars"
          }

          # Store functions for the final validation in this same, unprivileged job.
          declare -f mise_for_lock collect_sidecars > "$RUNNER_TEMP/mise-functions.sh"
          printf '%s' "$LOCK_GROUPS" > "$RUNNER_TEMP/lock-groups.json"
          jq -e '
            def strings: type == "array" and length > 0 and all(.[]; type == "string" and length > 0);
            type == "array" and all(.[];
              type == "object" and (keys | sort) == ["lockfile", "platforms", "tools", "verify"] and
              (.lockfile | type == "string" and test("^(?!/|\\.git(?:/|$))[^\\u0000\\r\\n]+$") and
                (split("/") | all(.[]; . != "" and . != "." and . != ".."))) and
              (.tools | strings and all(.[]; test("^[A-Za-z0-9][A-Za-z0-9_./:@+-]*$"))) and
              (.platforms | strings and all(.[]; test("^[a-z0-9]+(-[a-z0-9]+)+$"))) and
              (.verify == "regenerate" or .verify == "locked"))
          ' "$RUNNER_TEMP/lock-groups.json" > /dev/null || {
            echo '::error::Invalid lock-groups; expected lockfile, tools, platforms, verify (regenerate or locked)'
            exit 1
          }
          group_count=$(jq length "$RUNNER_TEMP/lock-groups.json")
          if [[ "$MISE_ENABLED" != true && "$group_count" != 0 ]]; then
            echo '::error::lock-groups requires mise-enabled'
            exit 1
          fi

          # Explicit groups must cover each selected config exactly once. Never silently
          # fall back to an all-platform resolution for a forgotten tool or lockfile.
          if [[ "$group_count" != 0 ]]; then
            jq -j '.[] | .lockfile + "\u0000"' "$RUNNER_TEMP/lock-groups.json" > "$RUNNER_TEMP/group-lockfiles"
            while IFS= read -r -d '' lock; do
              if ! git ls-files --error-unmatch -- "$lock" > /dev/null 2>&1 ||
                 ! tr '\0' '\n' < "$lockfiles" | grep -Fxq -- "$lock"; then
                echo "::error::lock-groups names an untracked or unselected lockfile: $lock"
                exit 1
              fi
            done < "$RUNNER_TEMP/group-lockfiles"
            while IFS= read -r -d '' lock; do
              mise_for_lock "$lock" config ls --json > "$RUNNER_TEMP/mise-configs.json"
              directory=$(realpath "$(dirname "$lock")")
              suffix=${lock##*/}; suffix=${suffix#mise}; suffix=${suffix%.lock}
              jq -e --arg dir "$directory" --arg suffix "$suffix" --arg lock "$lock" \
                --slurpfile groups "$RUNNER_TEMP/lock-groups.json" '
                [ .[] | select(
                    ((.path | sub("/[^/]+$"; "")) == $dir or (.path | sub("/[^/]+$"; "")) == ($dir + "/conf.d")) and
                    ((.path | split("/") | last) as $name |
                      ["mise" + $suffix + ".toml", ".mise" + $suffix + ".toml", "config" + $suffix + ".toml"] | index($name)))
                  | .tools[] ] | unique as $expected |
                [$groups[0][] | select(.lockfile == $lock) | .tools[]] as $actual |
                ($expected | length) > 0 and ($actual | length) == ($actual | unique | length) and
                ($actual | sort) == ($expected | sort)
              ' "$RUNNER_TEMP/mise-configs.json" > /dev/null || {
                echo "::error::lock-groups must cover every configured tool once for $lock"
                exit 1
              }
            done < "$lockfiles"
          fi

          while IFS= read -r -d '' lock; do
            collect_sidecars "$lock"
            if [[ "$group_count" == 0 ]]; then
              mise_for_lock "$lock" lock
            else
              jq -c --arg lock "$lock" '.[] | select(.lockfile == $lock)' "$RUNNER_TEMP/lock-groups.json" > "$RUNNER_TEMP/current-groups"
              while IFS= read -r group; do
                mapfile -t tools < <(jq -r '.tools[]' <<< "$group")
                platforms=$(jq -r '.platforms | join(",")' <<< "$group")
                if [[ "$VERIFY_ONLY" == true && "$(jq -r .verify <<< "$group")" == locked ]]; then
                  # Install the recorded graph on this runner; do not query a fresh solve.
                  # Other OS/CPU combinations belong in the caller's CI matrix.
                  mise_for_lock "$lock" install --locked "${tools[@]}"
                else
                  mise_for_lock "$lock" lock --platform "$platforms" "${tools[@]}"
                fi
              done < "$RUNNER_TEMP/current-groups"
            fi
          done < "$lockfiles"
      - name: Install Node and pnpm for Vite+ synchronization
        id: tools
        if: ${{ inputs['sync-vite-plus'] }}
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MISE_ENABLED" == true ]]; then
            mise install --locked node pnpm
            printf '%s/bin\n' "$(mise where node)" >> "$GITHUB_PATH"
            printf '%s\n' "$(mise where pnpm)" >> "$GITHUB_PATH"
          else
            [[ "$NODE_VERSION" =~ ^[0-9]+(\.[0-9]+\.[0-9]+)?$ && "$PNPM_VERSION" =~ ^[0-9]+(\.[0-9]+\.[0-9]+)?$ ]]
            # Resolve explicit maintenance versions outside the caller's configuration.
            cd "$RUNNER_TEMP"
            mise install "node@$NODE_VERSION" "pnpm@$PNPM_VERSION"
            printf '%s/bin\n' "$(mise where "node@$NODE_VERSION")" >> "$GITHUB_PATH"
            printf '%s\n' "$(mise where "pnpm@$PNPM_VERSION")" >> "$GITHUB_PATH"
          fi
      - name: Synchronize the selected Vite+ dependency graph
        id: sync
        if: ${{ inputs['sync-vite-plus'] }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vite-plus-sync.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { lstatSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { dirname, join, resolve } from 'node:path';

          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const manifest = path => JSON.parse(readFileSync(path, 'utf8'));
          const declarations = ['package.json', 'pnpm-workspace.yaml'];
          const readDeclarations = () => declarations.map(path => readFileSync(path, 'utf8'));
          const isAllowedArtifact = (path, allowed) => allowed.some(root => resolve(path) === root || resolve(path).startsWith(`${root}/`));
          const statePath = join(process.env.RUNNER_TEMP, 'vite-plus-state.json');
          const require = createRequire(join(process.cwd(), 'package.json'));
          const packagePath = (name, from = require) => {
            try { return from.resolve(`${name}/package.json`); }
            catch {
              let directory = dirname(from.resolve(name));
              while (directory !== dirname(directory)) {
                try {
                  const path = join(directory, 'package.json');
                  if (manifest(path).name === name) return path;
                } catch {}
                directory = dirname(directory);
              }
              throw new Error(`Cannot resolve package manifest: ${name}`);
            }
          };
          const unrelated = project => {
            const versions = new Map();
            const visited = new Set();
            const visit = (name, from, optional = false) => {
              let path;
              try { path = realpathSync(packagePath(name, from)); }
              catch (error) { if (optional) return; throw error; }
              if (visited.has(path)) return;
              visited.add(path);
              const pkg = manifest(path);
              const found = versions.get(pkg.name) ?? new Set();
              found.add(pkg.version);
              versions.set(pkg.name, found);
              const child = createRequire(path);
              for (const dep of Object.keys({ ...pkg.dependencies, ...pkg.optionalDependencies })) {
                visit(dep, child, Object.hasOwn(pkg.optionalDependencies ?? {}, dep));
              }
            };
            for (const name of Object.keys({ ...project.dependencies, ...project.devDependencies, ...project.optionalDependencies })) {
              if (name !== 'vite-plus' && name !== '@vitest/coverage-v8') {
                visit(name, require, Object.hasOwn(project.optionalDependencies ?? {}, name));
              }
            }
            return Object.fromEntries([...versions].sort(([a], [b]) => a.localeCompare(b)).map(([name, values]) => [name, [...values].sort()]));
          };

          function synchronizeOverrides(workspace, overrides) {
            // Only edit plain scalar overrides in a block mapping. Refuse anchors,
            // flow mappings and ambiguous selectors instead of rewriting other YAML.
            const lines = workspace.split('\n');
            const roots = lines.map((line, index) => /^overrides:\s*(?:#.*)?$/.test(line) ? index : -1).filter(index => index >= 0);
            assert.equal(roots.length, 1, 'pnpm-workspace.yaml needs a plain overrides block');
            const start = roots[0];
            let end = start + 1;
            while (end < lines.length && (!lines[end].trim() || /^\s|^#/.test(lines[end]))) end++;
            for (const [name, value] of Object.entries(overrides)) {
              const pattern = new RegExp(`^( +)(?:'(${name}(?:@\\*)?)'|"(${name}(?:@\\*)?)"|(${name}(?:@\\*)?)):\\s*(.*?)\\s*$`);
              const matches = [];
              for (let i = start + 1; i < end; i++) {
                const match = pattern.exec(lines[i]);
                if (match) matches.push({ index: i, match });
              }
              assert(matches.length <= 1, `Ambiguous ${name} overrides`);
              if (matches.length === 1) {
                const { index, match } = matches[0];
                assert.match(match[5], /^(?:'[^']*'|"[^"\\]*"|[^\s{}\[\]&*!#]+)(?:\s+#.*)?$/, `Unsupported ${name} override scalar`);
                const previous = match[5].replace(/\s+#.*$/, '').replace(/^['"]|['"]$/g, '');
                if (previous !== value) lines[index] = `${match[1]}${JSON.stringify(match[2] ?? match[3] ?? match[4])}: ${JSON.stringify(value)}`;
              } else {
                const indent = /^ +/.exec(lines.slice(start + 1, end).find(line => /^ +\S/.test(line)) ?? '')?.[0] ?? '  ';
                lines.splice(end++, 0, `${indent}${JSON.stringify(`${name}@*`)}: ${JSON.stringify(value)}`);
              }
            }
            return lines.join('\n');
          }

          const lockedVitestVersions = () => {
            const versions = new Set();
            // pnpm 12 can write a separate settings document. Inspect only
            // the final graph document, excluding override selectors.
            const lock = readFileSync('pnpm-lock.yaml', 'utf8').split(/^---[ \t]*\r?$/m).at(-1);
            let section = '';
            for (const line of lock.split('\n')) {
              if (/^[^\s#]/.test(line)) section = /^([A-Za-z]+):/.exec(line)?.[1] ?? '';
              if (section !== 'packages' && section !== 'snapshots') continue;
              const match = /^ {2}['"]?vitest@([^(:\n'"]+)/.exec(line);
              if (match) versions.add(match[1]);
            }
            return [...versions];
          };

          // Always verify in a fresh process: pnpm can switch node_modules symlinks.
          const graph = (state) => {
            const vpPath = packagePath('vite-plus');
            const vp = manifest(vpPath);
            assert.equal(vp.version, state.version, 'Synchronization must not update Vite+');
            assert.equal(vp.dependencies?.vitest, state.bundled, 'Bundled Vitest changed during synchronization');
            const fromRunner = createRequire(vpPath);
            const coveragePath = packagePath('@vitest/coverage-v8');
            const runnerPath = packagePath('vitest', fromRunner);
            const fromCoverage = createRequire(coveragePath);
            assert.deepEqual(lockedVitestVersions(), [state.bundled], 'The lockfile must resolve a single Vitest version');
            assert.equal(manifest(coveragePath).version, state.bundled, 'Coverage and bundled Vitest differ');
            assert.equal(manifest(runnerPath).version, state.bundled, 'The runner differs from bundled Vitest');
            assert.equal(realpathSync(packagePath('vitest', fromCoverage)), realpathSync(runnerPath), 'Multiple Vitest instances are resolved');
            const vite = manifest(packagePath('vite', fromRunner));
            assert.equal(vite.name, '@voidzero-dev/vite-plus-core', 'The Vite alias does not match');
            if (state.core) assert.equal(vite.version, state.core, 'The Vite core differs from bundled Vite');
            assert.deepEqual(unrelated(manifest('package.json')), state.unrelated, 'Unrelated dependency versions changed');
          };

          function verify() {
            const state = manifest(statePath);
            assert.deepEqual(readDeclarations(), state.declarations, 'Post-update task changed synchronized declarations');
            graph(state);
          }

          function synchronize() {
            const allowed = process.env.MISE_ENABLED === 'true'
              ? readFileSync(join(process.env.RUNNER_TEMP, 'mise-lock-artifacts'), 'utf8').split('\0').filter(Boolean).map(path => resolve(path))
              : [];
            const dirty = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' }) +
              execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z'], { encoding: 'utf8' });
            assert(dirty.split('\0').filter(Boolean).every(path => isAllowedArtifact(path, allowed)), 'Start from a clean checkout except prepared mise artifacts');
            assert.equal(git('diff', '--cached', '--name-only'), '', 'Start without staged changes');
            for (const path of [...declarations, 'pnpm-lock.yaml']) {
              assert(lstatSync(path).isFile(), `${path} must be a regular file`);
              assert.equal(git('ls-files', '--', path), path, `${path} must be tracked`);
            }
            const before = readDeclarations();
            const project = JSON.parse(before[0]);
            const coverage = project.devDependencies?.['@vitest/coverage-v8'];
            const syncDeclarations = process.env.SYNC_DECLARATIONS === 'true';
            assert.equal(typeof coverage, 'string', 'Declare @vitest/coverage-v8 in devDependencies');
            assert.match(coverage, syncDeclarations ? /^\d+(?:\.\d+\.\d+)?$/ : /^\d+$/, 'Coverage must use a major-only declaration, or an exact stable version with sync-declarations');
            const pnpm = (...args) => execFileSync('pnpm', [
              ...args, '--ignore-scripts', '--ignore-pnpmfile', '--config.manage-package-manager-versions=false',
            ], { stdio: 'inherit' });
            pnpm('install', '--frozen-lockfile');
            const vp = manifest(packagePath('vite-plus'));
            const bundled = vp.dependencies?.vitest;
            assert.equal(typeof bundled, 'string', 'Vite+ must declare its bundled Vitest');
            assert.match(bundled, /^\d+\.\d+\.\d+$/, 'Bundled Vitest must be an exact stable version');
            assert.equal(bundled.split('.')[0], coverage.split('.')[0], 'Vite+ changed its bundled Vitest major; review compatibility before updating');
            const state = { version: vp.version, bundled, unrelated: unrelated(project) };

            if (syncDeclarations) {
              const alias = vp.dependencies?.vite;
              assert.equal(typeof alias, 'string', 'Vite+ must declare its bundled Vite alias');
              assert.match(alias, /^npm:@voidzero-dev\/vite-plus-core@\d+\.\d+\.\d+$/, 'Bundled Vite must be an exact stable alias');
              state.core = alias.split('@').at(-1);
              project.devDependencies['@vitest/coverage-v8'] = bundled;
              if (coverage !== bundled) writeFileSync('package.json', `${JSON.stringify(project, null, 2)}\n`);

              const workspace = synchronizeOverrides(before[1], { vite: alias, vitest: bundled });
              if (workspace !== before[1]) writeFileSync('pnpm-workspace.yaml', workspace);
            }
            state.declarations = readDeclarations();
            writeFileSync(statePath, JSON.stringify(state));
            const verifyGraph = () => spawnSync(process.execPath, [process.argv[1], '--graph'], { encoding: 'utf8' });
            if (syncDeclarations && state.declarations.some((text, index) => text !== before[index])) {
              pnpm('install', '--no-frozen-lockfile');
            } else if (verifyGraph().status !== 0) {
              pnpm('update', `@vitest/coverage-v8@${bundled}`, '--no-save');
            }
            pnpm('install', '--frozen-lockfile');
            const result = verifyGraph();
            assert.equal(result.status, 0, result.stderr || String(result.error));
            assert.deepEqual(readDeclarations(), state.declarations, 'pnpm changed dependency declarations');
            const modified = git('diff', '--name-only').split('\n').filter(Boolean);
            assert(modified.every(path => [...declarations, 'pnpm-lock.yaml'].includes(path) || isAllowedArtifact(path, allowed)), 'Only dependency artifacts may change');
            assert.equal(git('ls-files', '--others', '--exclude-standard'), '', 'Synchronization created unrelated files');
            git('diff', '--check');
            console.log(`Vite+ ${vp.version}: verified single Vitest / coverage ${bundled}`);
          }

          switch (process.argv[2]) {
            case '--graph': graph(manifest(statePath)); break;
            case '--verify': verify(); break;
            case undefined: synchronize(); break;
            default: throw new Error(`Unknown synchronization mode: ${process.argv[2]}`);
          }
          JS
          node "$RUNNER_TEMP/vite-plus-sync.mjs"
      - name: Run generation tasks and prepare dependency artifacts
        id: update
        shell: bash
        run: |
          set -euo pipefail
          lockfiles="$RUNNER_TEMP/mise-lockfiles"
          artifacts="$RUNNER_TEMP/mise-lock-artifacts"
          source "$RUNNER_TEMP/mise-functions.sh"
          if [[ -s "$lockfiles" || "$SYNC_VITE_PLUS" == true ]]; then
            if [[ -n "$POST_UPDATE_TASK" ]]; then
              mise install --locked
              MISE_SAFE=0 mise run -- "$POST_UPDATE_TASK"
            fi
            while IFS= read -r -d '' lock; do
              mise_for_lock "$lock" install --locked --dry-run
              collect_sidecars "$lock"
            done < "$lockfiles"
          fi
          if [[ "$SYNC_VITE_PLUS" == true ]]; then node "$RUNNER_TEMP/vite-plus-sync.mjs" --verify; fi
          root=$(git rev-parse --show-toplevel)
          stage_path() {
            local path="$1"
            if [[ "$(realpath -m "$path")" != "$root/"* ]]; then
              echo "::error::Artifact paths must stay inside the repository: $path"
              exit 1
            fi
            if [[ -e "$path" || -L "$path" ]] || [[ -n "$(git --literal-pathspecs ls-files -- "$path")" ]]; then
              git --literal-pathspecs add -A -- "$path"
            fi
          }
          git reset --quiet
          while IFS= read -r -d '' path; do stage_path "$path"; done < "$artifacts"
          if [[ "$SYNC_VITE_PLUS" == true ]]; then
            stage_path pnpm-lock.yaml
            if [[ "$SYNC_DECLARATIONS" == true ]]; then
              stage_path package.json
              stage_path pnpm-workspace.yaml
            fi
          fi
          if [[ -s "$lockfiles" || "$SYNC_VITE_PLUS" == true ]]; then
            while IFS= read -r path || [[ -n "$path" ]]; do
              path=${path%$'\r'}
              [[ -n "$path" ]] || continue
              while [[ "$path" == ./* ]]; do path=${path#./}; done
              case "$path" in
                ''|/*|.|..|../*|*/../*|*/..|.git|.git/*)
                  echo "::error::Post-update paths must name files or directories inside the repository: $path"
                  exit 1 ;;
              esac
              stage_path "$path"
            done <<< "$POST_UPDATE_PATHS"
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$VERIFY_ONLY" == true ]]; then
            git diff --cached --stat
            echo '::error::Dependency artifacts are out of date; regenerate and commit them'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dependency-artifacts"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/dependency-artifacts/changes.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        if: ${{ !inputs['verify-only'] && steps.update.outputs.changed == 'true' }}
        with:
          name: dependency-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-artifacts/changes.patch
          if-no-files-found: error
          retention-days: 1
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base: ${{ steps.locks.outputs.base }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
  publish:
    needs: prepare
    if: ${{ !inputs['verify-only'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_ENABLED: ${{ inputs['mise-enabled'] }}
      SYNC_VITE_PLUS: ${{ inputs['sync-vite-plus'] }}
      SYNC_DECLARATIONS: ${{ inputs['sync-declarations'] }}
      POST_UPDATE_PATHS: ${{ inputs.post-update-paths }}
    steps:
      - name: Require App credentials for updates
        id: credentials
        env:
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Update mode requires app-client-id and app-private-key"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
        if: needs.prepare.outputs.changed == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/dependency-artifacts
        if: needs.prepare.outputs.changed == 'true'
      - name: Validate the payload and commit only allowed artifacts
        id: commit
        if: needs.prepare.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          payload="$RUNNER_TEMP/dependency-artifacts/changes.patch"
          [[ -f "$payload" && ! -L "$payload" ]]
          allowed="$RUNNER_TEMP/publish-allowed"
          : > "$allowed"
          if [[ "$MISE_ENABLED" == true ]]; then
            git ls-files -z -- 'mise.lock' 'mise.*.lock' '**/mise.lock' '**/mise.*.lock' > "$RUNNER_TEMP/publish-locks"
            while IFS= read -r -d '' lock; do
              printf '%s\0' "$lock" >> "$allowed"
              directory=$(dirname "$lock")
              case "$directory" in
                .mise|*/.mise|.config/mise|*/.config/mise) sidecars="$directory/locks" ;;
                .config|*/.config) sidecars="$directory/mise/locks" ;;
                *) sidecars="$directory/.mise/locks" ;;
              esac
              if [[ "${lock##*/}" != mise.lock ]]; then sidecars+="/${lock##*/}"; sidecars=${sidecars%.lock}; fi
              printf '%s/\0' "${sidecars#./}" >> "$allowed"
            done < "$RUNNER_TEMP/publish-locks"
          fi
          if [[ "$SYNC_VITE_PLUS" == true ]]; then
            printf 'pnpm-lock.yaml\0' >> "$allowed"
            if [[ "$SYNC_DECLARATIONS" == true ]]; then printf 'package.json\0pnpm-workspace.yaml\0' >> "$allowed"; fi
          fi
          while IFS= read -r path || [[ -n "$path" ]]; do
            path=${path%$'\r'}
            [[ -n "$path" ]] || continue
            while [[ "$path" == ./* ]]; do path=${path#./}; done
            case "$path" in ''|/*|.|..|../*|*/../*|*/..|.git|.git/*) exit 1 ;; esac
            printf '%s\0%s/\0' "$path" "${path%/}" >> "$allowed"
          done <<< "$POST_UPDATE_PATHS"
          git -c core.hooksPath=/dev/null apply --index --binary -- "$payload"
          git diff --cached --no-renames --name-only -z > "$RUNNER_TEMP/publish-changes"
          while IFS= read -r -d '' path; do
            accepted=false
            while IFS= read -r -d '' permit; do
              if [[ "$permit" == */ ]]; then
                if [[ "$path" == "$permit"* ]]; then accepted=true; fi
              elif [[ "$path" == "$permit" ]]; then accepted=true
              fi
            done < "$allowed"
            if [[ "$accepted" != true || "$path" == .git/* || "$path" == /* ]]; then
              echo "::error::Prepared payload changes a disallowed path: $path"
              exit 1
            fi
          done < "$RUNNER_TEMP/publish-changes"
          # Dependency artifacts must be ordinary files, never symlinks or submodules.
          if git diff --cached --raw | grep -Eq '^:[0-9]{6} (120000|160000) '; then
            echo '::error::Prepared artifacts must be regular files'
            exit 1
          fi
          git diff --cached --check
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): regenerate dependency artifacts'
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
        if: needs.prepare.outputs.changed == 'true'
      - name: Push only if the Renovate branch has not moved
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$BRANCH" == renovate/* ]]
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="refs/heads/${BRANCH}:${BASE_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"
        if: needs.prepare.outputs.changed == 'true'
