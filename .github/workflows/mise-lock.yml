name: mise-lock

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App installed on the caller repository
        required: true
        type: string
      post-update-task:
        description: Optional mise task that regenerates dependency-derived files
        required: false
        type: string
        default: ""
      post-update-paths:
        description: Newline-separated repository-relative files or directories to commit after the task
        required: false
        type: string
        default: ""
    secrets:
      app-private-key:
        description: Private key of the GitHub App with Contents write permission
        required: true

permissions:
  contents: read

jobs:
  mise-lock:
    if: >-
      github.event_name == 'push' &&
      github.event.sender.id == 29139614 &&
      startsWith(github.ref, 'refs/heads/renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mise-lock-${{ github.ref }}
      cancel-in-progress: true
    env:
      MISE_SAFE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          install: false
          cache: false
      - name: Update and validate dependency artifacts
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POST_UPDATE_TASK: ${{ inputs.post-update-task }}
          POST_UPDATE_PATHS: ${{ inputs.post-update-paths }}
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          lockfiles="$RUNNER_TEMP/mise-lockfiles"
          artifacts="$RUNNER_TEMP/mise-lock-artifacts"
          git ls-files -z -- 'mise.lock' 'mise.*.lock' '**/mise.lock' '**/mise.*.lock' > "$lockfiles"
          cp "$lockfiles" "$artifacts"
          if [[ ! -s "$lockfiles" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mise_for_lock() {
            local lock="$1" name="${1##*/}" mise_env="" is_local=false
            shift
            local args=("$@")
            case "$name" in
              mise.lock) ;;
              mise.local.lock) is_local=true ;;
              mise.*.local.lock)
                mise_env=${name#mise.}
                mise_env=${mise_env%.local.lock}
                is_local=true
                ;;
              mise.*.lock)
                mise_env=${name#mise.}
                mise_env=${mise_env%.lock}
                ;;
            esac
            if [[ "$1" == lock && "$is_local" == true ]]; then args+=(--local); fi
            (cd "$(dirname "$lock")" && MISE_ENV="$mise_env" mise "${args[@]}")
          }

          collect_sidecars() {
            local lock="$1" path
            mise_for_lock "$lock" lock --sidecars --json > "$RUNNER_TEMP/mise-sidecars.json"
            jq -j --arg lock "${lock##*/}" \
              '.[] | select(.lockfile == $lock) | .sidecars[] | .path + "\u0000"' \
              "$RUNNER_TEMP/mise-sidecars.json" > "$RUNNER_TEMP/mise-sidecars"
            while IFS= read -r -d '' path; do
              if [[ "$path" != /* ]]; then path="$(dirname "$lock")/$path"; fi
              printf '%s\0' "$path" >> "$artifacts"
            done < "$RUNNER_TEMP/mise-sidecars"
          }

          # Capture both old and new graph paths so removed sidecars are staged.
          while IFS= read -r -d '' lock; do
            collect_sidecars "$lock"
            mise_for_lock "$lock" lock
          done < "$lockfiles"
          if [[ -n "$POST_UPDATE_TASK" ]]; then
            mise install --locked
            # Only the caller-selected task may execute project configuration.
            MISE_SAFE=0 mise run -- "$POST_UPDATE_TASK"
          fi
          while IFS= read -r -d '' lock; do
            mise_for_lock "$lock" install --locked --dry-run
            collect_sidecars "$lock"
          done < "$lockfiles"

          stage_path() {
            local path="$1"
            if [[ -e "$path" || -L "$path" ]] || [[ -n "$(git --literal-pathspecs ls-files -- "$path")" ]]; then
              git --literal-pathspecs add -A -- "$path"
            fi
          }
          # A task may stage files; rebuild the index from the allowed paths.
          git reset --quiet
          while IFS= read -r -d '' path; do
            stage_path "$path"
          done < "$artifacts"
          while IFS= read -r path || [[ -n "$path" ]]; do
            path=${path%$'\r'}
            [[ -n "$path" ]] || continue
            while [[ "$path" == ./* ]]; do path=${path#./}; done
            case "$path" in
              ''|/*|.|..|../*|*/../*|*/..|.git|.git/*)
                echo "::error::Post-update paths must name files or directories inside the repository: $path"
                exit 1
                ;;
            esac
            stage_path "$path"
          done <<< "$POST_UPDATE_PATHS"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): regenerate dependency artifacts'
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create repository-scoped App token
        id: app-token
        if: steps.update.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
      - name: Push only if the branch has not moved
        id: push
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ steps.update.outputs.base }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="refs/heads/${BRANCH}:${BASE_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"
