name: Verify mise lock App

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  verify:
    if: github.actor_id == github.repository_owner_id && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MISE_LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify CI and remove the disposable branch
        id: verify
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="verification/mise-lock-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --allow-empty -m 'test: verify mise lock App CI trigger'
          head=$(git rev-parse HEAD)
          GH_TOKEN="$APP_TOKEN" git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$branch"
          cleanup() {
            GH_TOKEN="$APP_TOKEN" git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push --force-with-lease="refs/heads/$branch:$head" origin ":refs/heads/$branch"
            echo "Removed verification branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          }
          trap cleanup EXIT
          run=""
          for _ in {1..18}; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$branch" --commit "$head" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [[ -z "$run" ]] || break
            sleep 5
          done
          if [[ -z "$run" ]]; then
            echo "::error::The App push did not trigger CI within 90 seconds"
            exit 1
          fi
          # Leave time for cleanup before the job's timeout.
          timeout 20m gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5
          echo "CI succeeded: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_STEP_SUMMARY"
