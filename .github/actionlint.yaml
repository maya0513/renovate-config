paths:
  .github/workflows/ci.yml:
    ignore:
      # GitHub supports exact-commit self references; actionlint does not yet.
      - '^specifying action "\$/\.github/actions/(mise-pnpm|pnpm-outputs)"'
  .github/workflows/update.yml:
    ignore:
      # Remove when actionlint supports GitHub self repository references.
      - '^specifying action "\$/\.github/actions/(mise-pnpm|pnpm-outputs)"'
      - '^reusable workflow call "\$/\.github/workflows/publish-pnpm-artifacts\.yml" at "uses" is not following the format '
