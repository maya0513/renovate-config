name: Validate and collect pnpm dependency outputs
description: Run additional generation, validate the composed dependency state, and collect one publishing payload. No App credentials.
inputs:
  mise-state:
    description: State output from mise-pnpm
    required: false
    default: ""
  viteplus-state:
    description: State output from pnpm-viteplus
    required: false
    default: ""
  post-update-task:
    description: Optional mise task generating additional outputs only
    required: false
    default: ""
  post-update-paths:
    description: Newline-separated additional output files or directories
    required: false
    default: ""
outputs:
  base:
    description: Consumer commit used for the payload
    value: ${{ steps.base.outputs.base }}
  changed:
    description: Whether a validated payload was generated
    value: ${{ steps.stage.outputs.changed }}
  artifact-id:
    description: Immutable publishing artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: state
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MISE_STATE: ${{ inputs['mise-state'] }}
        VITEPLUS_STATE: ${{ inputs['viteplus-state'] }}
      run: node "$ACTION_PATH/validate-state.mjs"
    - id: base
      shell: bash
      run: printf "base=%s\n" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - id: task
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        POST_UPDATE_TASK: ${{ inputs['post-update-task'] }}
        MISE_SAFE: "1"
      run: bash "$ACTION_PATH/task.sh"
    - id: verify-locks
      if: inputs['mise-state'] != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MISE_SAFE: "1"
      run: bash "$ACTION_PATH/../mise-pnpm/verify.sh"
    - id: frozen
      if: inputs['viteplus-state'] != '' || inputs['mise-state'] != ''
      shell: bash
      run: |-
        if [[ -s "$RUNNER_TEMP/mise-lockfiles" || "$HAS_VITEPLUS" == true ]]; then
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --pm-on-fail=error
        fi
    - id: graph
      if: inputs['viteplus-state'] != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../pnpm-viteplus/sync.mjs" --verify
    - id: stage
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        POST_UPDATE_PATHS: ${{ inputs['post-update-paths'] }}
      run: bash "$ACTION_PATH/stage.sh"
    - id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: steps.state.outputs['verify-only'] == 'false' && steps.stage.outputs.changed == 'true'
      with:
        name: pnpm-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pnpm-artifacts/
        if-no-files-found: error
        retention-days: 1
